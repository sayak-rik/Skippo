services:
  postgres:
    image: postgres:16-alpine
    container_name: skippo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skippo
      POSTGRES_USER: skippo
      POSTGRES_PASSWORD: skippo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skippo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
      DJANGO_DEBUG: "True"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:8083"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:8083"
      SMS_SERVICE_URL: "http://sms-service:8090"
      EMAIL_SERVICE_URL: "http://email-service:8092"
      EMAIL_SERVICE_API_KEY: "${EMAIL_SERVICE_API_KEY:-dev-key-change-in-production}"
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-SKIPPO}"
      MSG91_TEMPLATE_ID: "${MSG91_TEMPLATE_ID:-}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sms-service:
        condition: service_started
      email-service:
        condition: service_started

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend-worker
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/compose/start-worker.sh"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend-beat
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/compose/start-beat.sh"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sms-service:
    build:
      context: ./sms-service
      dockerfile: Dockerfile
    container_name: skippo-sms-service
    restart: unless-stopped
    environment:
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-SKIPPO}"
      MSG91_TEMPLATE_ID: "${MSG91_TEMPLATE_ID:-}"
      SMS_DRY_RUN: "${SMS_DRY_RUN:-true}"
    ports:
      - "8090:8090"

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: skippo-email-service
    restart: unless-stopped
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_NAME: "Skippo"
      INTERNAL_API_KEY: "${EMAIL_SERVICE_API_KEY:-dev-key-change-in-production}"
      EMAIL_DRY_RUN: "${EMAIL_DRY_RUN:-true}"
    ports:
      - "8092:8092"

  call-agent:
    build:
      context: ./call-agent
      dockerfile: Dockerfile
    container_name: skippo-call-agent
    restart: unless-stopped
    environment:
      PLIVO_AUTH_ID: "${PLIVO_AUTH_ID:-}"
      PLIVO_AUTH_TOKEN: "${PLIVO_AUTH_TOKEN:-}"
      PLIVO_FROM_NUMBER: "${PLIVO_FROM_NUMBER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DATABASE_URL: "postgresql://skippo:skippo@postgres:5432/skippo"
      REDIS_URL: "redis://redis:6379/3"
      BASE_URL: "${CALL_AGENT_BASE_URL:-http://localhost:8091}"
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: skippo-website
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./website:/app
      - /app/node_modules
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: skippo-dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  parent-app:
    build:
      context: ./mobile/parent-app
      dockerfile: Dockerfile
    container_name: skippo-parent-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/parent-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      # Expo Web runs in the browser, so the API URL must be reachable from
      # the host machine (localhost), not the Docker internal network.
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_started

  driver-app:
    build:
      context: ./mobile/driver-app
      dockerfile: Dockerfile
    container_name: skippo-driver-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/driver-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8082:8081"
    depends_on:
      backend:
        condition: service_started

  teacher-app:
    build:
      context: ./mobile/teacher-app
      dockerfile: Dockerfile
    container_name: skippo-teacher-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/teacher-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8083:8081"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
