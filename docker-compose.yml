# ═══════════════════════════════════════════════════════════════════════════
# Skippo · Docker Compose
#
# PROFILES
#   backend   — Django API, Celery worker/beat, SMS, email, call-agent
#   frontend  — Dashboard (Next.js) + Website
#   mobile    — Parent, Driver, Teacher Expo apps
#
# NOTE: postgres and redis have no profile — they start with every command.
#       Frontend and mobile services do NOT declare depends_on for backend
#       across profiles; start the backend profile first when you need it.
#
# ── START ────────────────────────────────────────────────────────────────
#   Everything:          docker compose --profile backend --profile frontend --profile mobile up -d
#   Backend stack:       docker compose --profile backend up -d
#   Frontend only:       docker compose --profile frontend up -d
#   Mobile only:         docker compose --profile mobile up -d
#   Infra only:          docker compose up -d
#
# ── SINGLE SERVICE ───────────────────────────────────────────────────────
#   Start:               docker compose up -d <service>
#   Rebuild + restart:   docker compose up -d --force-recreate --build <service>
#   Tail logs:           docker compose logs -f <service>
#
# ── STOP ─────────────────────────────────────────────────────────────────
#   Everything:          docker compose --profile backend --profile frontend --profile mobile down
#   Keep volumes:        add  --volumes  to wipe postgres/redis data too
# ═══════════════════════════════════════════════════════════════════════════

# ─── REUSABLE FRAGMENTS ──────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
  PGHOST: postgres
  PGPORT: "5432"
  REDISHOST: redis
  REDISPORT: "6379"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-infra-depends: &infra-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

# ─────────────────────────────────────────────────────────────────────────────

services:

  # ╔══════════════════════════════╗
  # ║  INFRASTRUCTURE (no profile) ║
  # ╚══════════════════════════════╝

  postgres:
    image: postgres:16-alpine
    container_name: skippo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skippo
      POSTGRES_USER: skippo
      POSTGRES_PASSWORD: skippo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skippo-network
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: skippo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skippo-network
    logging: *default-logging

  # ╔═══════════════════════╗
  # ║  BACKEND  (profile)   ║
  # ╚═══════════════════════╝

  sms-service:
    build:
      context: ./sms-service
      dockerfile: Dockerfile
    container_name: skippo-sms-service
    restart: unless-stopped
    profiles: [backend]
    environment:
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-SKIPPO}"
      MSG91_TEMPLATE_ID: "${MSG91_TEMPLATE_ID:-}"
      SMS_DRY_RUN: "${SMS_DRY_RUN:-true}"
    ports:
      - "8090:8090"
    networks:
      - skippo-network
    logging: *default-logging

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: skippo-email-service
    restart: unless-stopped
    profiles: [backend]
    environment:
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_NAME: "Skippo"
      INTERNAL_API_KEY: "${EMAIL_SERVICE_API_KEY:-dev-key-change-in-production}"
      EMAIL_DRY_RUN: "${EMAIL_DRY_RUN:-true}"
    ports:
      - "8092:8092"
    networks:
      - skippo-network
    logging: *default-logging

  backend:
    build: *backend-build
    container_name: skippo-backend
    restart: unless-stopped
    profiles: [backend]
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
      DJANGO_DEBUG: "True"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:8082,http://localhost:8083"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8081,http://localhost:8082,http://localhost:8083"
      SMS_SERVICE_URL: "http://sms-service:8090"
      EMAIL_SERVICE_URL: "http://email-service:8092"
      EMAIL_SERVICE_API_KEY: "QK`|+AcMXy10@u7e2_n0&!c£."
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_SENDER_ID: "${MSG91_SENDER_ID:-SKIPPO}"
      MSG91_TEMPLATE_ID: "${MSG91_TEMPLATE_ID:-}"
    ports:
      - "8000:8000"
    depends_on:
      <<: *infra-depends
      sms-service:
        condition: service_started
      email-service:
        condition: service_started
    networks:
      - skippo-network
    logging: *default-logging

  backend-worker:
    build: *backend-build
    container_name: skippo-backend-worker
    restart: unless-stopped
    profiles: [backend]
    working_dir: /app
    command: ["sh", "/app/compose/start-worker.sh"]
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    depends_on: *infra-depends
    networks:
      - skippo-network
    logging: *default-logging

  backend-beat:
    build: *backend-build
    container_name: skippo-backend-beat
    restart: unless-stopped
    profiles: [backend]
    working_dir: /app
    command: ["sh", "/app/compose/start-beat.sh"]
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    depends_on: *infra-depends
    networks:
      - skippo-network
    logging: *default-logging

  call-agent:
    build:
      context: ./call-agent
      dockerfile: Dockerfile
    container_name: skippo-call-agent
    restart: unless-stopped
    profiles: [backend]
    environment:
      PLIVO_AUTH_ID: "${PLIVO_AUTH_ID:-}"
      PLIVO_AUTH_TOKEN: "${PLIVO_AUTH_TOKEN:-}"
      PLIVO_FROM_NUMBER: "${PLIVO_FROM_NUMBER:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DATABASE_URL: "postgresql://skippo:skippo@postgres:5432/skippo"
      REDIS_URL: "redis://redis:6379/3"
      BASE_URL: "${CALL_AGENT_BASE_URL:-http://localhost:8091}"
    ports:
      - "8091:8091"
    depends_on: *infra-depends
    networks:
      - skippo-network
    logging: *default-logging

  # ╔════════════════════════╗
  # ║  FRONTEND  (profile)   ║
  # ╚════════════════════════╝

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: skippo-website
    restart: unless-stopped
    profiles: [frontend]
    working_dir: /app
    volumes:
      - ./website:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    networks:
      - skippo-network
    logging: *default-logging

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: skippo-dashboard
    restart: unless-stopped
    profiles: [frontend]
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - skippo-network
    logging: *default-logging

  # ╔══════════════════════╗
  # ║  MOBILE  (profile)   ║
  # ╚══════════════════════╝

  parent-app:
    build:
      context: ./mobile/parent-app
      dockerfile: Dockerfile
    container_name: skippo-parent-app
    restart: unless-stopped
    profiles: [mobile]
    working_dir: /app
    volumes:
      - ./mobile/parent-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8081:8081"
    networks:
      - skippo-network
    logging: *default-logging

  driver-app:
    build:
      context: ./mobile/driver-app
      dockerfile: Dockerfile
    container_name: skippo-driver-app
    restart: unless-stopped
    profiles: [mobile]
    working_dir: /app
    volumes:
      - ./mobile/driver-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8082:8081"
    networks:
      - skippo-network
    logging: *default-logging

  teacher-app:
    build:
      context: ./mobile/teacher-app
      dockerfile: Dockerfile
    container_name: skippo-teacher-app
    restart: unless-stopped
    profiles: [mobile]
    working_dir: /app
    volumes:
      - ./mobile/teacher-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8083:8081"
    networks:
      - skippo-network
    logging: *default-logging

# ─────────────────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  redis_data:

networks:
  skippo-network:
    name: skippo-network
