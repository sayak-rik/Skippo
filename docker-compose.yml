services:
  postgres:
    image: postgres:16-alpine
    container_name: skippo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skippo
      POSTGRES_USER: skippo
      POSTGRES_PASSWORD: skippo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skippo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
      DJANGO_DEBUG: "True"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:8083"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:8083"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend-worker
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/compose/start-worker.sh"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skippo-backend-beat
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "/app/compose/start-beat.sh"]
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://skippo:skippo@postgres:5432/skippo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SETTINGS_MODULE: skippo_backend.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      REDISHOST: redis
      REDISPORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: skippo-website
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./website:/app
      - /app/node_modules
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: skippo-dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  parent-app:
    build:
      context: ./mobile/parent-app
      dockerfile: Dockerfile
    container_name: skippo-parent-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/parent-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      # Expo Web runs in the browser, so the API URL must be reachable from
      # the host machine (localhost), not the Docker internal network.
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_started

  driver-app:
    build:
      context: ./mobile/driver-app
      dockerfile: Dockerfile
    container_name: skippo-driver-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/driver-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8082:8081"
    depends_on:
      backend:
        condition: service_started

  teacher-app:
    build:
      context: ./mobile/teacher-app
      dockerfile: Dockerfile
    container_name: skippo-teacher-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mobile/teacher-app:/app
      - /app/node_modules
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      SKIPPO_API_URL: http://localhost:8000
    ports:
      - "8083:8081"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
